[package]
name = "komorebi-switcher"
version = "0.10.2"
description = "A minimal workspace switcher for the Komorebi tiling window manager, seamlessly integrated into Windows 10/11 taskbar or macOS menu bar."
authors = ["Amr Bashir <amr.bashir2015@gmail.com>"]
edition = "2021"
license = "MIT"

[package.metadata.winresource]
CompanyName = "Amr Bashir"
LegalCopyright = "© 2025 Amr Bashir. Licensed under the MIT License."

[profile.release]
codegen-units = 1 # Allows LLVM to perform better optimization.
lto = true        # Enables link-time-optimizations.
opt-level = "s"   # Prioritizes small binary size.
panic = "abort"   # Higher performance by disabling panic handlers.
strip = true      # Ensures debug symbols are removed.

[target."cfg(windows)".build-dependencies]
winresource = "0.1"

[dependencies]
anyhow = "1.0.103"
serde_json = "1.0"
dirs = "6.0"
serde = { version = "1.0", features = ["derive"] }
strum = { version = "0.27", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
# The app uses native dialogs on Windows and macOS, not Linux portal backends.
rfd = { version = "0.15.4", default-features = false }
font-kit = "0.14.3"
color = "0.3.2"

[target."cfg(windows)".dependencies]
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
raw-window-handle = "0.6"
wgpu = { version = "29", default-features = false, features = [
  "std",
  "dx12",
  "wgsl",
] }
pollster = "0.4"
egui = "0.34.3"
egui-winit = { version = "0.34.3", default-features = false, features = [
  "clipboard",
  "links",
] }
egui-wgpu = { version = "0.34.3", default-features = false }
egui_animation = "0.11"
windows-registry = "0.5"
muda = "0.17"
tray-icon = "0.21"
uds_windows = "1.1"

[target."cfg(windows)".dependencies.windows]
version = "0.61"
features = [
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_LibraryLoader",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_Input_KeyboardAndMouse",
  "UI_ViewManagement",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_DirectComposition",
  "Win32_Graphics_Dxgi_Common",
  "Win32_UI_HiDpi",
]

[target.'cfg(target_os = "macos")'.dependencies]
dispatch = "0.2.0"
objc2 = "0.6.3"
objc2-foundation = "0.3.2"
objc2-app-kit = "0.3.2"
